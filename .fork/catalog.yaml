# Fork catalog — the sidecar taxonomy for every skill in this repo.
#
# Sidecar by design: upstream `SKILL.md` frontmatter is never edited to carry
# fork metadata, because every such edit is a future merge conflict.
#
# Fields per skill:
#   name      directory basename — also the flat install name, unique repo-wide
#   path      repo-relative skill directory
#   origin    `upstream` (mattpocock/skills owns the bytes) | `fork` (we do)
#   domain    upstream skills keep their upstream bucket; fork skills are
#             grouped by capability domain
#   audience  which roles the skill serves — one skill may serve several
#   owner     GitHub team with approval authority (mirrors CODEOWNERS)
#   status    optional: `beta` exempts a team skill from promotion (no docs
#             page, out of the top-level README, flat `## Beta` list in its
#             bucket README). Omit it for a promoted skill.
#
# `CATALOG.md` is generated from this file:
#   python3 scripts/generate-catalog.py           # rewrite
#   python3 scripts/generate-catalog.py --check   # fail if stale (CI)

version: 1

# Role vocabulary. `docs/roles/` has one entry page per audience.
audiences: [engineer, designer, analyst, qa, staff]

# Domain vocabulary. `design`, `discovery`, and `quality` are reserved for
# future team domains — their folders are created when the first skill lands.
domains:
  - engineering
  - productivity
  - misc
  - in-progress
  - deprecated
  - mobile
  - platform
  - design
  - discovery
  - quality

